# Default training configuration for LOB baseline models

data:
  data_dir: data/raw
  ticker: AAPL
  levels: null              # null = use whatever's in data/raw

features:
  ofi_max_level: 5
  trade_flow_windows: [1.0, 5.0, 30.0]

target:
  horizon: 5                # Prediction horizon in events

walk_forward:
  mode: expanding           # expanding | rolling
  initial_train_frac: 0.5
  test_frac: 0.1
  min_gap: 5                # Should match target.horizon to purge leakage

models:
  - persistence
  - linear
  - xgboost

xgboost:
  n_estimators: 200
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

results_dir: results
